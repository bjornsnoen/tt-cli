name: Publish to pypi

on:
  push:
    branches:
      - trunk

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: "Install uv"
        uses: astral-sh/setup-uv@v5

      - name: Build and publish
        run: |
          uv build
          uv publish --index brbcoffee
        env:
          repository_name: brbcoffee
          UV_PUBLISH_USERNAME: ${{ secrets.BRBCOFFEE_PYPI_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.BRBCOFFEE_PYPI_PASSWORD }}
